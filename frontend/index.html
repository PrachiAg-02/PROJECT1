<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Iris Flower Predictor</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 520px; margin: 40px auto; padding: 24px; background: #f8fafc; color: #1e293b; }
    .card { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    h2 { margin-top: 0; color: #0f172a; text-align: center; }
    .input-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    input:focus { outline: none; border-color: #3b82f6; ring: 2px solid #93c5fd; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    #result-box { margin-top: 20px; display: none; }
    .badge { padding: 12px; border-radius: 6px; font-weight: 600; text-align: center; margin-bottom: 16px; }
    .success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .bar-container { margin-bottom: 10px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .bar-bg { width: 100%; background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
    .bar-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 0.4s ease-in-out; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🌸 Iris Species Predictor</h2>
    
    <div class="input-group">
      <label>Sepal Length (cm)</label>
      <input type="number" step="any" id="f1" value="5.9">
    </div>
    <div class="input-group">
      <label>Sepal Width (cm)</label>
      <input type="number" step="any" id="f2" value="3.0">
    </div>
    <div class="input-group">
      <label>Petal Length (cm)</label>
      <input type="number" step="any" id="f3" value="4.2">
    </div>
    <div class="input-group">
      <label>Petal Width (cm)</label>
      <input type="number" step="any" id="f4" value="1.5">
    </div>

    <button onclick="makePrediction()">Predict Species</button>

    <div id="result-box">
      <div id="badge-msg" class="badge"></div>
      <div id="confidence-bars"></div>
    </div>
  </div>

  <script>
    async function makePrediction() {
      const f1 = parseFloat(document.getElementById('f1').value);
      const f2 = parseFloat(document.getElementById('f2').value);
      const f3 = parseFloat(document.getElementById('f3').value);
      const f4 = parseFloat(document.getElementById('f4').value);
      
      const resultBox = document.getElementById('result-box');
      const badgeMsg = document.getElementById('badge-msg');
      const barsDiv = document.getElementById('confidence-bars');

      try {
        const res = await fetch('http://127.0.0.1:5000/api/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ features: [f1, f2, f3, f4] })
        });
        const data = await res.json();

        if (data.status === "success") {
          badgeMsg.className = "badge success";
          badgeMsg.innerText = `Top Prediction: ${data.class_name} (Class ${data.prediction})`;
          
          barsDiv.innerHTML = "";
          data.confidence_scores.forEach(item => {
            barsDiv.innerHTML += `
              <div class="bar-container">
                <div class="bar-label">
                  <span>${item.name}</span>
                  <span>${item.confidence}%</span>
                </div>
                <div class="bar-bg">
                  <div class="bar-fill" style="width: ${item.confidence}%"></div>
                </div>
              </div>
            `;
          });
          resultBox.style.display = 'block';
        } else {
          throw new Error(data.error || "Prediction failed");
        }
      } catch (err) {
        resultBox.style.display = 'block';
        badgeMsg.className = "badge error";
        badgeMsg.innerText = err.message || 'Failed to connect to backend server.';
        barsDiv.innerHTML = '';
      }
    }
  </script>
</body>
</html>
